version: '3.8'
name: log-monitor

services:
  # 1. Main webservice (FrankenPHP)
  app:
    image: log-monitor-app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: log-monitor-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-0.5}'
          memory: '${APP_MEMORY_LIMIT:-256M}'
    volumes:
      - storage_data:/var/www/html/storage:z
    env_file:
      - ../.env
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      - LOG_MONITOR_CONTAINER=true
    extra_hosts:
      - "log-monitor.local:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 2. Worker
  worker:
    image: log-monitor-app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: log-monitor-worker
    restart: always
    command: ["/bin/bash", "-c", "while true; do php bin/worker.php; sleep 5; done"]
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPU_LIMIT:-0.3}'
          memory: '${WORKER_MEMORY_LIMIT:-128M}'
    blkio_config:
      device_write_bps:
        - path: /dev/nvme0n1
          rate: 300mb
      device_read_bps:
        - path: /dev/nvme0n1
          rate: 300mb
    volumes:
      - storage_data:/var/www/html/storage:z
    env_file:
      - ../.env
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      - LOG_MONITOR_CONTAINER=true
    extra_hosts:
      - "log-monitor.local:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # 3. Database
  db:
    image: docker.io/library/mariadb:12.3.2
    container_name: log-monitor-db
    restart: always
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-64M}", "--max-connections=${DB_MAX_CONNECTIONS:-50}"]
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-33061}:${DB_PORT:-33061}"
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-1.0}'
          memory: '${DB_MEMORY_LIMIT:-512M}'
    blkio_config:
      device_write_bps:
        - path: /dev/nvme0n1
          rate: 300mb
      device_read_bps:
        - path: /dev/nvme0n1
          rate: 300mb
    env_file:
      - ../.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MYSQL_DATABASE=${DB_DATABASE:-log_monitor}
      - MYSQL_USER=${DB_USERNAME:-user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - TZ=${TZ:-Europe/Bucharest}
      - MYSQL_TCP_PORT=${DB_PORT:-33061}
    volumes:
      - db_data:/var/lib/mysql:Z
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro,Z
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  storage_data:

networks:
  default:
    name: log_monitor_net

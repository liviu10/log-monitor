# Configuration Nginx - Complet Automatizata
server {
    listen 80;
    server_name log-monitor.local; # Inlocuieste cu domeniul tau real in productie

    # Locatia partajata cu Certbot pentru validarea automata HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirectionare automata restul traficului spre HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name log-monitor.local; # Inlocuieste cu domeniul tau real in productie

    # Rute sigure catre certificatele gestionate automat de scriptul de boot
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2M;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
server {
    listen 443 ssl;
    server_name log-monitor.local;
    server_tokens off; # Ascundere versiune Nginx pentru protectie impotriva recunoasterii (reconnaissance)

    # Rute catre certificatele gestionate automat de scriptul de boot
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2M;

    # =========================================================================
    # PACHETUL COMPLET DE HEADERE DE SECURITATE LA NIVEL DE PROXY
    # =========================================================================
    
    # Protectie anti-clickjacking aliniata cu directiva frame-ancestors 'none' din PHP
    add_header X-Frame-Options "DENY" always;
    
    # Blocheaza atacurile bazate pe ghicirea tipului de continut (MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Seteaza politica de transmitere a header-ului Referer catre alte domenii
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Fortreaza conexiunea exclusiva prin HTTPS pe o perioada de 1 an
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Hardening Hardware: Blocheaza accesul la functionalitatile dispozitivului
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    
    # Izolarea contextului de navigare la nivel de proces in browser
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # =========================================================================

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
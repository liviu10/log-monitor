[PHP]
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_execution_time = 30
display_errors = Off
log_errors = On
date.timezone = Europe/Bucharest
expose_php = Off

; Hardening: Izolare sistem de fisiere si dezactivare functii sensibile
open_basedir = /var/www/html:/tmp:/root:/opt
disable_functions = exec,system,shell_exec,passthru,dl

[opcache]
opcache.enable=1
opcache.enable_cli=1
# Redus de la 128M la 48M - suficient pentru structura actuala de clase
opcache.memory_consumption=48
opcache.interned_strings_buffer=8
# Redus de la 10000 la 3000 de fisiere accelerate
opcache.max_accelerated_files=3000
opcache.revalidate_freq=0
# Dezactivat in productie pentru a evita verificarile constante pe disc
opcache.validate_timestamps=0
opcache.save_comments=0

; PHP 8.4 JIT Configuration adaptat pentru consum mic in idle
opcache.jit=tracing
; Redus de la 64M la 16M static allocation
opcache.jit_buffer_size=16M

[MySQLi]
mysqli.allow_persistent = On
mysqli.max_persistent = -1
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.reconnect = Off

[PHP]
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 60
display_errors = Off
log_errors = On
date.timezone = Europe/Bucharest
expose_php = Off

; Izolare sistem de fisiere si blocare functii periculoase (Hardening)
open_basedir = /var/www/html:/tmp
disable_functions = exec,system,shell_exec,passthru,proc_open,proc_close,popen,curl_multi_exec,parse_ini_file,show_source

; Securitate sporita pentru cookie-uri de sesiune
session.use_strict_mode = 1
session.use_only_cookies = 1

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
opcache.validate_timestamps=1
opcache.save_comments=1

; PHP 8.4 JIT Configuration
opcache.jit=tracing
opcache.jit_buffer_size=64M

[MySQLi]
mysqli.allow_persistent = On
mysqli.max_persistent = -1
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.reconnect = Off
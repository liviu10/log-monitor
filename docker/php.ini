[PHP]
; --- Resource limits (per request / per CLI run) ---
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 12M
max_file_uploads = 10
max_execution_time = 30
max_input_time = 30
max_input_vars = 1000
max_input_nesting_level = 32
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; $_ENV is populated from the container environment (compose passes only the
; whitelisted application variables, never the DB root password).
variables_order = "EGPCS"

; --- Errors: log, never display ---
display_errors = Off
display_startup_errors = Off
log_errors = On
; error_log unset => FrankenPHP/CLI log to stderr (docker logs)
error_reporting = E_ALL & ~E_DEPRECATED

; --- Hardening ---
expose_php = Off
allow_url_include = Off
open_basedir = /var/www/html:/tmp:/usr/local/etc/php
date.timezone = Europe/Bucharest
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; CVE-2026-109619 & PHP 8.5 defense-in-depth
fatal_error_backtraces = 0

[Session]
; Persisted on the storage volume => deploys don't log users out.
session.save_path = "/var/www/html/storage/sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 86400
session.upload_progress.enabled = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
; Compiled scripts cached on tmpfs: the worker's short-lived CLI runs reuse them.
; /tmp is wiped on every container recreate, so a deploy never serves stale code.
opcache.file_cache = /tmp/opcache
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
; Code is immutable inside the image => never stat files.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 0
opcache.enable_file_override = 1
; JIT brings ~nothing for I/O-bound web apps and costs RAM; keep it off.
opcache.jit = disable
opcache.jit_buffer_size = 0

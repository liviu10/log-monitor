# trivy.yaml
# LogMonitor Security Scanner Configuration (Trivy)

scan:
  scanners:
    - vuln
    - misconfig
    - secret

# Verificam toate nivelurile de severitate, inclusiv Warning-uri (MEDIUM) si Informationale (LOW)
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW

format: table

vulnerability:
  ignore-unfixed: false

misconfiguration:
  scanners:
    - dockerfile
    - yaml

file:
  exclude:
    - "storage/framework/cache/**"
    - "storage/logs/**"
    - ".phpunit.cache/**"
    - "tests/**"
